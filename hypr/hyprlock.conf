$text_color = rgba(d7e4efFF)
$entry_background_color = rgba(111d2511)
$entry_border_color = rgba(91909155)
$entry_color = rgba(d7e4efFF)
$capslock_color = rgba(f2b8b5ff)
$font_family = Rubik
$font_family_clock = Space Grotesk DemiBold
$font_material_symbols = Material Symbols Rounded

background {
    color = rgba(181818FF)

    path = /home/thales/Pictures/wallpapers/w.jpg

    blur_size = 3
    blur_passes = 2
    brightness = 0.66
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true
    capslock_color = $capslock_color

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family_clock

    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text =     $USER
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:30000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}
