$power = $HOME/.config/hypr/hyprland/scripts/power.sh
$lock = $HOME/.config/quicklock/quicklock

general {
    lock_cmd = $lock
    before_sleep_cmd = $power lock
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = $power lock
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = $power suspend
}
